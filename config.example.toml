# 自像比对 (maibot.self-check) · 配置示例
#
# 用法：把本文件复制成 config.toml 后按需修改。config.toml 已被 .gitignore 排除，
#       不会进仓库（插件中心明确禁止仓库根目录出现 config.toml）。
# 不复制也能加载：插件会使用 config.py 里的默认值，但比对提示词是占位模板，必须自己填写。
# 改配置热重载即生效；改 .py 需要重载插件。

[plugin]
name = "maibot_self_check"
version = "0.2.4"
config_version = "1.0.0"
enabled = true

[trigger]
# 必须带图才比对；关掉会变成每条消息都调模型，既费钱也没意义。
require_image = true
# 自我指向短语，子串匹配。只放比「你」更长的词，避免「你看这个」「你好」误触发。
keywords = [
    "像你",
    "是你",
    "画你",
    "你自己",
    "你本人",
    "你的样子",
    "自画像",
    "你长什么样",
    "这就是你",
    "和你一样",
]
# 往前看几条用户消息找图。图文常常是两条独立消息（先发图，再补一句「这是你吗」）。
lookback = 8
# 群聊闸门：必须 @ 了机器人、或直接叫了它的名字/别名，才比对。
# 判定直接用宿主算好的 is_at / is_mentioned（昵称与别名在 bot_config 的 [bot] 段）。
group_require_at = true
# 找「这是你吗」这类问句时最多往回看几条（取图仍按 lookback 找 8 条）。
text_lookback = 4
# 问句与最新一条消息的最大间隔（秒），0 = 不限。默认 120 秒覆盖常见的追问间隔。
text_max_age_seconds = 120

[engine]
# 直连视觉模型（宿主 ctx.llm 不支持一次带两张图，只能自己发）。
# 换成你自己可用的、支持一次请求两张图的模型名。
model = "Qwen/Qwen3-VL-30B-A3B-Instruct"
# 按这个名字去宿主 model_config.toml 取 base_url / api_key；
# 下面两项填了就用填的（推荐留空，别把密钥抄一份到这里）。
provider_name = "SiliconFlow"
base_url = ""
api_key = ""
# 单次比对超时。超时直接放弃本轮注入，不重试。
timeout_seconds = 15.0
# 缩放后的最长边。基准图太小会糊掉发饰等细节，过大只增加 token。
max_ref_side = 1280
max_test_side = 1024
jpeg_quality = 85
temperature = 0.1
max_tokens = 300

[refs]
# 主基准图：你自己角色的正/侧/背三视图。相对路径按插件目录解析。
# 🔴 本仓库不附带任何形象图，请自己放一张到 refs/three_view.jpg，见 refs/README.md。
primary = "refs/three_view.jpg"
# 备用图：主图缺失时使用。留空 = 不启用。
fallback = ""

[limits]
# 每日比对上限（0 = 不限）。按你所用模型的实际单价估算开销。
daily_max = 80
# 同一张图（按字节 hash）结论缓存多久。0 = 不缓存。
cache_minutes = 30

[inject]
# 注入到 planner 请求尾部的一行（尾部快变区，不碰前缀缓存）。
# 占位符：{verdict_cn} {verdict} {confidence} {differences} {diff_line} {one_line} {advice}
template = "[自像比对] 已比对：{verdict_cn}，置信 {confidence}。{diff_line}{advice}"
# 四档结论的中文说法，用 | 分隔、= 对应。
verdict_labels = "same=同一个角色（换了衣服/场景/画风也算同一个）|similar=很像，但外貌有出入|different=不是同一个角色|unclear=没法判断"

[prompt]
# 比对提示词。🔴 部署前必须把【方括号里的占位内容】换成你自己角色的外貌，
# 否则模型没有判据。核心原则：换装/换场景/换画风都不算差异。
compare = """图1是【你的角色名】的三视图参考（正面/侧面/背面，同一个角色）。图2是待判断的图片。

🔴 图2里可能有一个或多个人物（双人同框、合影、和别的角色一起出现都很常见）。
比对前先在心里做这件事（不要把过程写出来）：在图2里逐个找出所有人物，分别记下每个人的
发色、发型、瞳色；然后拿【每一个人】分别跟图1比。只要其中有一个人三条主特征对得上，
结论就是 same。
不要因为同框的另一个人不是本人、或者另一个人的发色更醒目、画在更中间，就判 different；
也不要把别人的发色发型按到本人身上。判断时以「像不像图1这个角色」为准，不是「这张图整体像不像」。

这是 AI 生成的图或同人图，细节常有偏差。先看下面三条「主特征」，主特征对得上就判 same，
不要因为细节瑕疵（配饰有无、颜色浓淡、瞳色冷暖）就降级。

主特征（必须对得上；⚠️ 下面三行请换成你自己角色的外貌，否则判据无意义）：
① 发色发型：【用一句话写清发色、长度、刘海，例如「栗色及肩卷发、斜刘海」】
② 瞳色：【例如：偏蓝紫，紫中带蓝、有高光】
③ 脸型：【例如：下巴偏尖，细眉长眼】
【另写一行说明什么算「本质不同」，例如：整头彩发、短发、卷发 = 不同】

参考项（不作为降级依据，只帮确认）：【例如：常戴的发饰；不同造型可能不戴，一律不影响判级】。

不算差异的：服装、鞋子、发饰与配饰、姿势、动作、背景、光线、画风（含 Q 版/厚涂/赛璐璐）、
构图、表情、年龄感，以及三条主特征的浓淡深浅。

判级：
same      = 三条主特征都对得上（细节有偏差照样算 same）
similar   = 有 1 项主特征明显不对，但整体仍是同一角色
different = 主特征本质不同，或明显是另一个人
unclear   = 看不清、被遮挡、或无法判断

differences 只写【本人】与图1的外貌差异（最多 3 条，每条 12 字内），不要写服装、背景、动作，
也不要把同框另一个人的长相当成本人的差异。判 same 时一般留空。
one_line 是给聊天用的一句话结论，20 字内，第三人称陈述，例如「是同一个人，只是换了衣服」；
图里有别人时要点明，例如「是我，旁边那个不是我」。

严格输出 JSON，不要别的内容：
{"verdict":"same|similar|different|unclear","confidence":0.0,"differences":[],"one_line":""}"""

[debug]
# 诊断用：填一个消息 ID，插件加载时试着取这条消息的图并打日志。验证完请清空。
probe_msg_id = ""
# 每轮规划打一行诊断。排查时开，通了就关（缺这行日志时钩子静默失败很难查）。
trace = false
